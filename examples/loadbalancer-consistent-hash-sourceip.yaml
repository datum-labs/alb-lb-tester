# ConsistentHash on the client source IP.
# From one machine every request shares a source IP, so all traffic sticks to
# one backend (that IS the correct result). To see the hash spread you need
# multiple client IPs.
#
# Needs the alb-lb-tester-a, -b and -c workloads (see "Quick start on Datum
# Compute" in the README).
apiVersion: networking.datumapis.com/v1alpha
kind: HTTPProxy
metadata:
  name: lb-tester-hash-sourceip
spec:
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: SourceIP
  rules:
    - backends:
        - networkService:
            name: alb-lb-tester-a
            port: http
        - networkService:
            name: alb-lb-tester-b
            port: http
        - networkService:
            name: alb-lb-tester-c
            port: http
