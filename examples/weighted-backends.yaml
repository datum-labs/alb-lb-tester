# Weighted backends: split traffic ~80/20 across two origin workloads.
# Send traffic from the dashboard and confirm the distribution bars sit near
# 80% / 20%.
#
# Needs the alb-lb-tester-a and alb-lb-tester-b workloads, with BACKEND_ID
# backend-a and backend-b (see "Quick start on Datum Compute" in the README).
apiVersion: networking.datumapis.com/v1alpha
kind: HTTPProxy
metadata:
  name: lb-tester-weighted
spec:
  rules:
    - backends:
        - networkService:
            name: alb-lb-tester-a
            port: http
          weight: 80
        - networkService:
            name: alb-lb-tester-b
            port: http
          weight: 20
