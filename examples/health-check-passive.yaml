# Passive health checks (outlier detection). An endpoint that returns 5
# consecutive 5xx is ejected for 30s, then re-admitted; repeat ejections last
# longer. Use the dashboard's Health checks tab to make one backend fail.
#
# Outlier detection ejects endpoints within a backend and never moves traffic
# between backends. Each backend here has a single instance, so a failing one
# is ejected but keeps its share: while it's ejected, the proxy answers those
# requests with its own 503. To see the traffic go to healthy instances
# instead, use health-check-compute.yaml.
#
# Needs the alb-lb-tester-a and alb-lb-tester-b workloads (see "Quick start
# on Datum Compute" in the README).
apiVersion: networking.datumapis.com/v1alpha
kind: HTTPProxy
metadata:
  name: lb-tester-health-check
spec:
  healthCheck:
    passive:
      consecutive5xxErrors: 5
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  rules:
    - backends:
        - networkService:
            name: alb-lb-tester-a
            port: http
        - networkService:
            name: alb-lb-tester-b
            port: http
