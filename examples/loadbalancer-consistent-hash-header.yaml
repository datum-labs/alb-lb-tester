# ConsistentHash on a request header.
# In the dashboard: Constant key mode -> every request with the same
# x-lb-key must hit ONE backend (sticky). Random key mode -> keys spread
# across backends. The header name here must match the dashboard's.
#
# Needs the alb-lb-tester-a, -b and -c workloads (see "Quick start on Datum
# Compute" in the README).
apiVersion: networking.datumapis.com/v1alpha
kind: HTTPProxy
metadata:
  name: lb-tester-hash-header
spec:
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      type: Header
      header: x-lb-key
  rules:
    - backends:
        - networkService:
            name: alb-lb-tester-a
            port: http
        - networkService:
            name: alb-lb-tester-b
            port: http
        - networkService:
            name: alb-lb-tester-c
            port: http
