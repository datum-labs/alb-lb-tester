# Load-balancing algorithm. RoundRobin spreads requests evenly across
# backends. With equal (default) weights, expect a near-even split. Random and
# LeastRequest are drop-in swaps for spec.loadBalancer.type.
#
# Needs the alb-lb-tester-a, -b and -c workloads (see "Quick start on Datum
# Compute" in the README).
apiVersion: networking.datumapis.com/v1alpha
kind: HTTPProxy
metadata:
  name: lb-tester-round-robin
spec:
  loadBalancer:
    type: RoundRobin        # or Random, or LeastRequest
  rules:
    - backends:
        - networkService:
            name: alb-lb-tester-a
            port: http
        - networkService:
            name: alb-lb-tester-b
            port: http
        - networkService:
            name: alb-lb-tester-c
            port: http
