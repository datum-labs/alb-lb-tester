<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1004 472" width="1004" height="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Three ways to run it</title>
<g transform="translate(0,0)">
<rect x="0.5" y="0.5" width="323" height="441" rx="10" fill="#223143" stroke="#384555"/>
<text x="12" y="21" font-size="14" font-weight="600" fill="#f6f6f5">Local or another cloud</text>
<g transform="translate(12,30)"><desc id="run-local-d">Your browser and the dashboard server run on your machine or a VM outside Datum. The dashboard server sends test requests to the proxy; the Load balancing tab sends them from your browser. The proxy forwards to origins on Datum Compute.</desc><defs><marker id="run-local-test" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2eb88a" stroke="none"></path></marker><marker id="run-local-page" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#90969c" stroke="none"></path></marker><marker id="run-local-blocked" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d25b5b" stroke="none"></path></marker></defs><g><rect x="6" y="6" width="288" height="150" rx="12" stroke-dasharray="2 4" fill="none" stroke="#90969c" stroke-opacity="0.500" stroke-width="1"></rect><text x="16" y="22" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#90969c" stroke="none">YOUR MACHINE OR VM</text></g><g><rect x="20" y="36" width="116" height="48" rx="8" fill="#223143" stroke="#f6f6f5" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="78" y="64" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f6f6f5" stroke="none">Your browser</text></g><g><rect x="164" y="36" width="116" height="48" rx="8" fill="#223143" stroke="#f6f6f5" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="222" y="57" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f6f6f5" stroke="none">Dashboard</text><text x="222" y="73" text-anchor="middle" font-size="10.5" fill="#90969c" stroke="none">npm / docker</text></g><g><line x1="164" y1="60" x2="138" y2="60" stroke-dasharray="5 4" marker-end="url(#run-local-page)" fill="#000000" stroke="#90969c" stroke-width="1.5"></line></g><text x="92" y="136" text-anchor="end" font-size="10.5" font-weight="600" fill="#2eb88a" stroke="none">Load</text><text x="92" y="150" text-anchor="end" font-size="10.5" font-weight="600" fill="#2eb88a" stroke="none">balancing</text><text x="206" y="136" text-anchor="start" font-size="10.5" font-weight="600" fill="#2eb88a" stroke="none">other tabs</text><text x="206" y="150" text-anchor="start" font-size="10.5" font-weight="600" fill="#2eb88a" stroke="none">(Server mode)</text><g><rect x="6" y="176" width="288" height="218" rx="12" stroke-dasharray="2 4" fill="none" stroke="#90969c" stroke-opacity="0.500" stroke-width="1"></rect><text x="16" y="192" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#90969c" stroke="none">DATUM</text></g><g><line x1="78" y1="84" x2="132" y2="220" marker-end="url(#run-local-test)" fill="#000000" stroke="#2eb88a" stroke-width="2"></line></g><g><line x1="222" y1="84" x2="168" y2="220" marker-end="url(#run-local-test)" fill="#000000" stroke="#2eb88a" stroke-width="2"></line></g><g><rect x="80" y="220" width="140" height="48" rx="8" fill="#223143" stroke="#f6f6f5" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="150" y="241" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f6f6f5" stroke="none">Proxy under test</text><text x="150" y="257" text-anchor="middle" font-size="10.5" fill="#90969c" stroke="none">your HTTPProxy</text></g><g><line x1="150" y1="268" x2="150" y2="318" marker-end="url(#run-local-test)" fill="#000000" stroke="#2eb88a" stroke-width="2"></line></g><g><rect x="60" y="318" width="180" height="56" rx="8" fill="#223143" stroke="#f6f6f5" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="150" y="343" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f6f6f5" stroke="none">Origins</text><text x="150" y="359" text-anchor="middle" font-size="10.5" fill="#90969c" stroke="none">Compute workload, 3 instances</text></g></g>
</g>
<g transform="translate(340,0)">
<rect x="0.5" y="0.5" width="323" height="441" rx="10" fill="#223143" stroke="#384555"/>
<text x="12" y="21" font-size="14" font-weight="600" fill="#f6f6f5">Hosted on Datum Compute</text>
<g transform="translate(12,30)"><desc id="run-compute-d">Your browser loads the dashboard from a Compute workload behind a login, and sends the proxy tests itself, because the dashboard can't currently reach Datum proxies. The same workload is the origin. The dashboard reaches instances directly by internal name for Sticky failure.</desc><defs><marker id="run-compute-test" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2eb88a" stroke="none"></path></marker><marker id="run-compute-page" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#90969c" stroke="none"></path></marker><marker id="run-compute-blocked" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d25b5b" stroke="none"></path></marker></defs><g><rect x="100" y="10" width="120" height="48" rx="8" fill="#223143" stroke="#f6f6f5" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="160" y="38" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f6f6f5" stroke="none">Your browser</text></g><g><rect x="6" y="82" width="288" height="312" rx="12" stroke-dasharray="2 4" fill="none" stroke="#90969c" stroke-opacity="0.500" stroke-width="1"></rect><text x="16" y="98" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#90969c" stroke="none">DATUM</text></g><g><line x1="124" y1="58" x2="84" y2="112" marker-end="url(#run-compute-test)" fill="#000000" stroke="#2eb88a" stroke-width="2"></line></g><g><rect x="20" y="112" width="128" height="48" rx="8" fill="#223143" stroke="#f6f6f5" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="84" y="133" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f6f6f5" stroke="none">Proxy under test</text><text x="84" y="149" text-anchor="middle" font-size="10.5" fill="#90969c" stroke="none">your HTTPProxy</text></g><g><line x1="210" y1="58" x2="248" y2="256" stroke-dasharray="5 4" marker-end="url(#run-compute-page)" fill="#000000" stroke="#90969c" stroke-width="1.5"></line></g><text x="236" y="140" text-anchor="start" font-size="10.5" font-weight="400" fill="#90969c" stroke="none">page,</text><text x="236" y="154" text-anchor="start" font-size="10.5" font-weight="400" fill="#90969c" stroke="none">login</text><g><line x1="198" y1="256" x2="150" y2="162" stroke-dasharray="5 4" marker-end="url(#run-compute-blocked)" fill="#000000" stroke="#d25b5b" stroke-width="1.5"></line><path d="M168,203 L180,215 M180,203 L168,215" fill="#000000" stroke="#d25b5b" stroke-width="2.25"></path></g><text x="90" y="196" text-anchor="start" font-size="10.5" font-weight="600" fill="#2eb88a" stroke="none">browser</text><text x="90" y="210" text-anchor="start" font-size="10.5" font-weight="600" fill="#2eb88a" stroke="none">mode</text><g><line x1="84" y1="160" x2="84" y2="256" marker-end="url(#run-compute-test)" fill="#000000" stroke="#2eb88a" stroke-width="2"></line></g><rect x="14" y="226" width="272" height="152" rx="10" fill="none" stroke="#f6f6f5" stroke-opacity="0.250" stroke-width="1"></rect><text x="24" y="242" text-anchor="start" font-size="10.5" font-weight="400" fill="#90969c" stroke="none">ONE WORKLOAD</text><g><rect x="24" y="256" width="112" height="56" rx="8" fill="#223143" stroke="#f6f6f5" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="80" y="281" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f6f6f5" stroke="none">/api/whoami</text><text x="80" y="297" text-anchor="middle" font-size="10.5" fill="#90969c" stroke="none">origin</text></g><g><rect x="176" y="256" width="100" height="56" rx="8" fill="#223143" stroke="#f6f6f5" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="226" y="281" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f6f6f5" stroke="none">Dashboard</text><text x="226" y="297" text-anchor="middle" font-size="10.5" fill="#90969c" stroke="none">behind a login</text></g><g><line x1="176" y1="296" x2="138" y2="296" stroke-dasharray="5 4" marker-end="url(#run-compute-page)" fill="#000000" stroke="#90969c" stroke-width="1.5"></line></g><text x="150" y="336" text-anchor="middle" font-size="10.5" font-weight="400" fill="#90969c" stroke="none">Sticky failure: dashboard → each</text><text x="150" y="350" text-anchor="middle" font-size="10.5" font-weight="400" fill="#90969c" stroke="none">instance by internal name,</text><text x="150" y="364" text-anchor="middle" font-size="10.5" font-weight="400" fill="#90969c" stroke="none">not through the proxy</text></g>
</g>
<g transform="translate(680,0)">
<rect x="0.5" y="0.5" width="323" height="441" rx="10" fill="#223143" stroke="#384555"/>
<text x="12" y="21" font-size="14" font-weight="600" fill="#f6f6f5">CI origin only</text>
<g transform="translate(12,30)"><desc id="run-ci-d">Automated load-balancing tests send requests to the proxy, which forwards them to origins running with ORIGIN_ONLY=1. There is no dashboard.</desc><defs><marker id="run-ci-test" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2eb88a" stroke="none"></path></marker><marker id="run-ci-page" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#90969c" stroke="none"></path></marker><marker id="run-ci-blocked" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d25b5b" stroke="none"></path></marker></defs><g><rect x="70" y="10" width="160" height="48" rx="8" fill="#223143" stroke="#f6f6f5" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="150" y="31" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f6f6f5" stroke="none">Automated LB tests</text><text x="150" y="47" text-anchor="middle" font-size="10.5" fill="#90969c" stroke="none">CI, curl, scripts</text></g><g><rect x="6" y="82" width="288" height="312" rx="12" stroke-dasharray="2 4" fill="none" stroke="#90969c" stroke-opacity="0.500" stroke-width="1"></rect><text x="16" y="98" font-size="10.5" font-weight="600" letter-spacing="0.6" fill="#90969c" stroke="none">DATUM</text></g><g><line x1="150" y1="58" x2="150" y2="120" marker-end="url(#run-ci-test)" fill="#000000" stroke="#2eb88a" stroke-width="2"></line></g><g><rect x="80" y="120" width="140" height="48" rx="8" fill="#223143" stroke="#f6f6f5" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="150" y="141" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f6f6f5" stroke="none">Proxy under test</text><text x="150" y="157" text-anchor="middle" font-size="10.5" fill="#90969c" stroke="none">HTTPProxy</text></g><g><line x1="150" y1="168" x2="150" y2="230" marker-end="url(#run-ci-test)" fill="#000000" stroke="#2eb88a" stroke-width="2"></line></g><g><rect x="50" y="230" width="200" height="56" rx="8" fill="#223143" stroke="#f6f6f5" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="150" y="255" text-anchor="middle" font-size="12.5" font-weight="600" fill="#f6f6f5" stroke="none">Origins</text><text x="150" y="271" text-anchor="middle" font-size="10.5" fill="#90969c" stroke="none">ORIGIN_ONLY=1</text></g><text x="150" y="318" text-anchor="middle" font-size="10.5" font-weight="400" fill="#90969c" stroke="none">/api/whoami only;</text><text x="150" y="332" text-anchor="middle" font-size="10.5" font-weight="400" fill="#90969c" stroke="none">no dashboard, no server-side tools</text></g>
</g>
<line x1="4" y1="457" x2="30" y2="457" stroke="#2eb88a" stroke-width="2"/><text x="36" y="461" font-size="12" fill="#90969c">test traffic</text>
<line x1="134.8" y1="457" x2="160.8" y2="457" stroke="#90969c" stroke-width="2" stroke-dasharray="5 4"/><text x="166.8" y="461" font-size="12" fill="#90969c">the page, or the dashboard asking its server</text>
<line x1="470.40000000000003" y1="457" x2="496.40000000000003" y2="457" stroke="#d25b5b" stroke-width="2" stroke-dasharray="5 4"/><text x="502.40000000000003" y="461" font-size="12" fill="#90969c">can't currently connect</text>
</svg>
