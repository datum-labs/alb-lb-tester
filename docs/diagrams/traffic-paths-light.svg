<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 664 424" width="664" height="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Where test traffic flows: Server mode and Browser mode</title>
<g transform="translate(0,0)">
<rect x="0.5" y="0.5" width="323" height="393" rx="10" fill="#ffffff" stroke="#e8e7e4"/>
<text x="12" y="21" font-size="14" font-weight="600" fill="#0c1d31">Server mode</text>
<g transform="translate(12,30)"><desc id="flow-server-d">Your browser asks the dashboard's server to run the test. The dashboard's server sends the test requests to the proxy, which forwards them to the origins.</desc><defs><marker id="flow-server-test" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d90" stroke="none"></path></marker><marker id="flow-server-page" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a" stroke="none"></path></marker><marker id="flow-server-blocked" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d25b5b" stroke="none"></path></marker></defs><g><rect x="70" y="10" width="160" height="48" rx="8" fill="#f4f4f5" stroke="#0c1d31" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="150" y="31" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0c1d31" stroke="none">Your browser</text><text x="150" y="47" text-anchor="middle" font-size="10.5" fill="#71717a" stroke="none">the dashboard page</text></g><g><line x1="150" y1="58" x2="150" y2="104" stroke-dasharray="5 4" marker-end="url(#flow-server-page)" fill="#000000" stroke="#71717a" stroke-width="1.5"></line></g><text x="158" y="85" text-anchor="start" font-size="10.5" font-weight="400" fill="#71717a" stroke="none">starts the run</text><g><rect x="70" y="104" width="160" height="48" rx="8" fill="#f4f4f5" stroke="#0c1d31" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="150" y="125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0c1d31" stroke="none">Dashboard server</text><text x="150" y="141" text-anchor="middle" font-size="10.5" fill="#71717a" stroke="none">/api/inspect, /api/probe</text></g><g><line x1="150" y1="152" x2="150" y2="198" marker-end="url(#flow-server-test)" fill="#000000" stroke="#2a9d90" stroke-width="2"></line></g><text x="158" y="179" text-anchor="start" font-size="10.5" font-weight="600" fill="#2a9d90" stroke="none">test requests</text><g><rect x="70" y="198" width="160" height="48" rx="8" fill="#f4f4f5" stroke="#0c1d31" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="150" y="219" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0c1d31" stroke="none">Proxy under test</text><text x="150" y="235" text-anchor="middle" font-size="10.5" fill="#71717a" stroke="none">Datum HTTPProxy</text></g><g><line x1="150" y1="246" x2="150" y2="292" marker-end="url(#flow-server-test)" fill="#000000" stroke="#2a9d90" stroke-width="2"></line></g><text x="158" y="273" text-anchor="start" font-size="10.5" font-weight="600" fill="#2a9d90" stroke="none">forwarded</text><g><rect x="70" y="292" width="160" height="48" rx="8" fill="#f4f4f5" stroke="#0c1d31" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="150" y="313" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0c1d31" stroke="none">Origins</text><text x="150" y="329" text-anchor="middle" font-size="10.5" fill="#71717a" stroke="none">this app's /api/whoami</text></g></g>
</g>
<g transform="translate(340,0)">
<rect x="0.5" y="0.5" width="323" height="393" rx="10" fill="#ffffff" stroke="#e8e7e4"/>
<text x="12" y="21" font-size="14" font-weight="600" fill="#0c1d31">Browser mode</text>
<g transform="translate(12,30)"><desc id="flow-browser-d">The dashboard's server only serves the page. Your browser sends the test requests to the proxy, which forwards them to the origins.</desc><defs><marker id="flow-browser-test" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d90" stroke="none"></path></marker><marker id="flow-browser-page" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#71717a" stroke="none"></path></marker><marker id="flow-browser-blocked" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d25b5b" stroke="none"></path></marker></defs><g><rect x="70" y="10" width="160" height="48" rx="8" stroke-dasharray="4 3" fill="#f4f4f5" stroke="#71717a" stroke-opacity="0.600" stroke-width="1.25"></rect><text x="150" y="31" text-anchor="middle" font-size="12.5" font-weight="600" fill="#71717a" stroke="none">Dashboard server</text><text x="150" y="47" text-anchor="middle" font-size="10.5" fill="#71717a" stroke="none">serves the page only</text></g><g><line x1="150" y1="58" x2="150" y2="104" stroke-dasharray="5 4" marker-end="url(#flow-browser-page)" fill="#000000" stroke="#71717a" stroke-width="1.5"></line></g><text x="158" y="85" text-anchor="start" font-size="10.5" font-weight="400" fill="#71717a" stroke="none">the page</text><g><rect x="70" y="104" width="160" height="48" rx="8" fill="#f4f4f5" stroke="#0c1d31" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="150" y="125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0c1d31" stroke="none">Your browser</text><text x="150" y="141" text-anchor="middle" font-size="10.5" fill="#71717a" stroke="none">the dashboard page</text></g><g><line x1="150" y1="152" x2="150" y2="198" marker-end="url(#flow-browser-test)" fill="#000000" stroke="#2a9d90" stroke-width="2"></line></g><text x="158" y="179" text-anchor="start" font-size="10.5" font-weight="600" fill="#2a9d90" stroke="none">test requests</text><g><rect x="70" y="198" width="160" height="48" rx="8" fill="#f4f4f5" stroke="#0c1d31" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="150" y="219" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0c1d31" stroke="none">Proxy under test</text><text x="150" y="235" text-anchor="middle" font-size="10.5" fill="#71717a" stroke="none">Datum HTTPProxy</text></g><g><line x1="150" y1="246" x2="150" y2="292" marker-end="url(#flow-browser-test)" fill="#000000" stroke="#2a9d90" stroke-width="2"></line></g><text x="158" y="273" text-anchor="start" font-size="10.5" font-weight="600" fill="#2a9d90" stroke="none">forwarded</text><g><rect x="70" y="292" width="160" height="48" rx="8" fill="#f4f4f5" stroke="#0c1d31" stroke-opacity="0.350" stroke-width="1.25"></rect><text x="150" y="313" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0c1d31" stroke="none">Origins</text><text x="150" y="329" text-anchor="middle" font-size="10.5" fill="#71717a" stroke="none">this app's /api/whoami</text></g></g>
</g>
<line x1="4" y1="409" x2="30" y2="409" stroke="#2a9d90" stroke-width="2"/><text x="36" y="413" font-size="12" fill="#71717a">test traffic</text>
<line x1="134.8" y1="409" x2="160.8" y2="409" stroke="#71717a" stroke-width="2" stroke-dasharray="5 4"/><text x="166.8" y="413" font-size="12" fill="#71717a">the page, or the dashboard asking its server</text>
</svg>
