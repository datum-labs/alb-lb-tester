name: Compute image

# Builds the tester for Datum Compute and publishes it to GHCR, so it can run
# as a multi-instance workload: the backend shape the Health checks tab needs
# to see outlier detection eject a single endpoint.
#
# Also publishes the same Dockerfile as a regular container image (tags
# `container-*`), which runs anywhere a container does: Compute's
# general-purpose runtime, Docker, other hosts. The unikernel image runs only
# on Compute's unikernel runtime.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'Dockerfile.datum'
      - 'next.config.mjs'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/compute-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: compute-image
  cancel-in-progress: true

env:
  DATUMCTL_VERSION: 0.20.0
  # `datumctl compute` is a plugin, not part of datumctl itself.
  COMPUTE_PLUGIN_VERSION: v0.10.9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install datumctl
        run: |
          curl -fsSL -o datumctl.deb \
            "https://github.com/datum-cloud/datumctl/releases/download/v${DATUMCTL_VERSION}/datumctl_${DATUMCTL_VERSION}_linux_amd64.deb"
          sudo dpkg -i datumctl.deb
          datumctl plugin install "compute@${COMPUTE_PLUGIN_VERSION}"
          datumctl compute build --help > /dev/null

      # Docker's built-in builder has no OCI exporter, which datumctl needs, so
      # run a standalone BuildKit daemon and point datumctl at it.
      - name: Start BuildKit
        run: |
          docker run -d --name buildkitd --privileged -p 127.0.0.1:1234:1234 \
            moby/buildkit:v0.23.2 --addr tcp://0.0.0.0:1234
          echo "BUILDKIT_HOST=tcp://127.0.0.1:1234" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            docker exec buildkitd buildctl --addr tcp://127.0.0.1:1234 debug workers >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs buildkitd
          exit 1

      # --analyze fails the build on the two problems that otherwise only show
      # up after boot: an entrypoint that isn't x86_64, and a shared library
      # missing from the final stage.
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          datumctl compute build --analyze --push --output "${image}:sha-${GITHUB_SHA::12}" .
          datumctl compute build --push --output "${image}:latest" .
          echo "Pushed ${image}:sha-${GITHUB_SHA::12} and ${image}:latest" >> "$GITHUB_STEP_SUMMARY"

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.datum
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:container-sha-${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.name }}:container-latest

      - name: Summary
        run: echo "Pushed ${{ steps.image.outputs.name }}:container-latest" >> "$GITHUB_STEP_SUMMARY"
